<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events & Calendar</title>
</head>
<body>
<header>
    <div class="header-left">
        <a href="/" class="home-btn" th:if="${#authorization.expression('isAuthenticated()')}">
            <img src="https://i.ibb.co/5TR58kn/home.png" alt="Home">
        </a>
    </div>
    <div class="brand-logo">
        <a href="/"><img src="https://i.ibb.co/Vvp7kp1/famge-removebg-preview.png" alt="FamBase"></a>
    </div>
    <div class="header-right">
        <a href="/login" class="nav-link" th:if="${#authorization.expression('!isAuthenticated()')}">Login</a>
        <a href="/register" class="nav-link" th:if="${#authorization.expression('!isAuthenticated()')}">Register</a>
        <a href="/logout" class="nav-link" th:if="${#authorization.expression('isAuthenticated()')}">Logout</a>
    </div>
</header>


<div class="dashboard-container">
    <div class="events-layout-grid">

        <section class="card">
            <div class="card-title">Your Events</div>
            <div class="scrollable-list">
                <div th:if="${#lists.isEmpty(events)}" style="text-align: center; color: var(--text-muted); padding: 15px; font-style: italic;">
                    No events found.
                </div>
                <ul>
                    <li th:each="event : ${events}">
                        <div class="task-details">
                            <span class="bold" th:text="${event.name}">Event Name</span><br>
                            <span style="font-size: 0.85rem;" th:text="${event.startDate + ' to ' + event.endDate}"></span><br>
                            <span style="font-size: 0.8rem; opacity: 0.8;" th:text="${'Type: ' + event.type + ' | ' + event.importance}"></span>
                        </div>
                        <div class="item-actions">
                            <a th:href="@{|/events/delete?id=${event.id}|}" title="Delete Event">🗑️</a>
                        </div>
                    </li>
                </ul>
            </div>
        </section>

        <!-- Calendar Card -->
        <section class="card">
            <div class="card-title">
                <a href="/events/allevents" th:if="${#authorization.expression('isAuthenticated()')}">Calendar Overview</a>
            </div>
            <div class="calendar-wrapper">
                <table>
                    <tr id="currentTr">
                        <td id="prev">Prev</td>
                        <td colspan="5" id="month">May</td>
                        <td id="next">Next</td>
                    </tr>
                    <tr class="dayRow">
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                    </tr>
                    <tr class="dayRow">
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                    </tr>
                    <tr class="dayRow">
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                    </tr>
                    <tr class="dayRow">
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                    </tr>
                    <tr class="dayRow">
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                    </tr>
                    <tr class="dayRow">
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                        <td class="dateCell"></td>
                    </tr>
                </table>
                <div id="btn-action-container" style="display: flex; justify-content: center">
                    <a id="addEventLink" style="width: 100%;">
                        <button class="btn-action" disabled="true" id="addEventButton">Add Event</button>
                    </a>
                </div>


            </div>
        </section>

    </div>
</div>

<script th:inline="javascript">
    const events = [[${events}]];

    const cells = document.querySelectorAll(".dateCell");
    const monthLabel = document.getElementById("month");
    const addEventButton = document.getElementById("addEventButton");
    const addEventLink = document.getElementById("addEventLink");

    let displayedDate = new Date();
    let startDate = null;
    let endDate = null;

    function formatDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
    }

    function sameDay(date1, date2) {
        return formatDate(date1) === formatDate(date2);
    }

    function isBetween(date, start, end) {
        return date >= start && date <= end;
    }

    function getEventsForDate(date) {
        const dateString = formatDate(date);
        return events.filter(event =>
            dateString >= event.startDate &&
            dateString <= event.endDate
        );
    }

    function renderCalendar() {
        const year = displayedDate.getFullYear();
        const month = displayedDate.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        monthLabel.textContent = displayedDate.toLocaleString("default", {
            month: "long",
            year: "numeric"
        });

        cells.forEach(cell => {
            cell.innerHTML = "";
            cell.style = "";
            cell.onclick = null;
        });

        for (let day = 1; day <= daysInMonth; day++) {
            const cell = cells[firstDay + day - 1];
            const cellDate = new Date(year, month, day);

            cell.textContent = day;
            cell.style.cursor = "pointer";

            const dayEvents = getEventsForDate(cellDate);

            if (dayEvents.length > 0) {
                cell.title = dayEvents.map(event => event.name).join("\n");
            }

            if (startDate && (sameDay(cellDate, startDate) || (endDate && isBetween(cellDate, startDate, endDate)))) {
                cell.style.backgroundColor = "var(--primary-color)";
                cell.style.color = "white";
            }

            cell.onclick = () => selectDate(cellDate);
        }
    }

    function selectDate(date) {
        if (startDate === null) {
            startDate = date;
            endDate = null;
        } else if (endDate === null) {
            if (date < startDate) {
                endDate = startDate;
                startDate = date;
            } else {
                endDate = date;
            }
        } else {
            startDate = date;
            endDate = null;
        }

        updateAddEventButton();
        renderCalendar();
    }

    function updateAddEventButton() {
        if (startDate === null) {
            addEventButton.disabled = true;
            addEventLink.removeAttribute("href");
            return;
        }

        const finalEndDate = endDate ?? startDate;
        const start = formatDate(startDate);
        const end = formatDate(finalEndDate);

        addEventLink.href = `/events/new?startDate=${start}&endDate=${end}`;
        addEventButton.disabled = false;
    }

    document.getElementById("next").onclick = () => {
        displayedDate.setMonth(displayedDate.getMonth() + 1);
        renderCalendar();
    };

    document.getElementById("prev").onclick = () => {
        displayedDate.setMonth(displayedDate.getMonth() - 1);
        renderCalendar();
    };

    renderCalendar();
</script>

</body>
<style>
    :root {
        --primary-dark: #401F3E;
        --primary-color: #732f65;
        --card-bg: rgb(255, 232, 230);
        --accent-bg: rgba(115, 47, 101, 0.68);
        --text-main: #401F3E;
        --text-muted: #5A4B51;
        --radius-lg: 20px;
        --radius-md: 12px;
        --shadow-subtle: 0 4px 12px rgba(64, 31, 62, 0.15);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
        color: var(--primary-color);
        background: radial-gradient(circle, rgba(236, 205, 205, 1) 25%, rgba(186, 112, 182, 1) 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
    }

    a {
        text-decoration: none;
        color: inherit;
    }

    header {
        width: 100%;
        height: 70px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 24px;
        background: radial-gradient(circle, rgba(236, 205, 205, 0.9) 8%, rgba(186, 112, 182, 0.9) 100%);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .header-left, .header-right {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .home-btn {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        background: var(--card-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-subtle);
        transition: transform 0.2s;
    }

    .home-btn:hover {
        transform: scale(1.05);
    }

    .home-btn img {
        width: 24px;
        height: 24px;
    }

    .brand-logo img {
        height: 40px;
        border-radius: 8px;
    }

    .nav-link {
        padding: 8px 16px;
        border-radius: var(--radius-md);
        background-color: var(--card-bg);
        font-weight: 600;
        font-size: 0.95rem;
        color: var(--primary-dark);
        box-shadow: var(--shadow-subtle);
        transition: background 0.2s;
    }

    .nav-link:hover {
        background-color: #ffd4d1;
    }

    .dashboard-container {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
        max-width: 1200px;
        width: 100%;
        margin: auto;
        flex: 1;
    }

    .events-layout-grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 24px;
        width: 100%;
        align-items: stretch;
    }

    .card {
        background-color: var(--card-bg);
        border-radius: var(--radius-lg);
        padding: 24px;
        box-shadow: var(--shadow-subtle);
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .card-title {
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--primary-dark);
        text-align: center;
        padding-bottom: 8px;
        border-bottom: 2px solid rgba(98, 68, 91, 0.2);
    }

    .card-title a:hover {
        opacity: 0.8;
    }

    .calendar-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        flex-grow: 1;
        justify-content: space-between;
    }

    table {
        border-spacing: 4px;
        width: 100%;
        /*margin-bottom: 20%;*/
    }

    th, td {
        text-align: center;
        font-size: 0.9rem;
        width: 36px;
        height: 36px;
    }

    .dateCell {
        font-weight: normal;
        border-radius: 50%;
        user-select: none;
        cursor: pointer;
        transition: background-color 0.2s;
    }

    .dateCell:hover {
        background-color: rgba(98, 68, 91, 0.1);
    }

    #currentTr td {
        font-size: 0.95rem;
        background-color: transparent;
        color: var(--primary-dark);
    }

    #prev, #next {
        cursor: pointer;
        color: var(--primary-dark);
    }

    #prev:hover, #next:hover {
        text-decoration: underline;
    }

    .btn-action {
        background-color: var(--primary-color);
        color: white;
        border: none;
        padding: 10px 16px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
        border-radius: 15%;
        width: 100%;
    }

    .btn-action:disabled {
        background-color: rgba(152, 59, 131, 0.56);
        cursor: not-allowed;
    }

    .btn-action:not(:disabled):hover {
        opacity: 0.9;
    }

    .scrollable-list {
        max-height: 320px;
        overflow-y: auto;
        padding-right: 4px;
        flex-grow: 1;
    }

    .scrollable-list::-webkit-scrollbar {
        width: 6px;
    }

    .scrollable-list::-webkit-scrollbar-thumb {
        background-color: rgba(98, 68, 91, 0.2);
        border-radius: 10px;
    }

    ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    li {
        background: rgba(255, 255, 255, 0.6);
        padding: 10px 14px;
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.95rem;
        color: var(--text-muted);
    }

    .task-details {
        flex-grow: 1;
    }

    li .bold {
        font-weight: 700;
        color: var(--primary-dark);
    }

    .item-actions {
        display: flex;
        gap: 8px;
        margin-left: auto;
        padding-left: 10px;
    }

    @media (max-width: 900px) {
        .events-layout-grid {
            grid-template-columns: 1fr;
        }
    }
</style>
</html>
