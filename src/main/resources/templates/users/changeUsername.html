<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <link th:href="@{/style.css}" rel="stylesheet" />
    <title>Change Username</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div id="header">
    <a href="/" th:if="${#authorization.expression('isAuthenticated()')}">
        <div class="headerDiv" id="homeButtonDiv"><img id="homeButton" src="https://i.ibb.co/5TR58kn/home.png"></div>
    </a>
    <a href="/"><img id="famBaseImage" src="https://i.ibb.co/Vvp7kp1/famge-removebg-preview.png"></a>
    <div id="accountConnection">
        <a href="/login" th:if="${#authorization.expression('!isAuthenticated()')}"><div class="headerDiv"><verticallyCentered>Login</verticallyCentered></div></a>
        <a href="/register" th:if="${#authorization.expression('!isAuthenticated()')}"><div class="headerDiv"><verticallyCentered>Register</verticallyCentered></div></a>
        <a href="/logout" th:if="${#authorization.expression('isAuthenticated()')}"><div class="headerDiv"><verticallyCentered>Logout</verticallyCentered></div></a>
    </div>
</div>

<div id="formBody">
    <h1>Change Username</h1>

    <div id="inputs">
        <form th:action="@{/change-username}" method="post">
            <div>
                <label for="currentUsername" style="font-size: 14px; color: #5A4B51; display: block; margin-bottom: 5px;">Current Username:</label>
                <input id="currentUsername" type="text" th:value="${currentUsername}" disabled style="background-color: #e6e6e6; cursor: not-allowed;" />
            </div>

            <div>
                <label for="newUsername" style="font-size: 14px; color: #5A4B51; display: block; margin-bottom: 5px;">New Username:</label>
                <input id="newUsername" name="newUsername" type="text" required />
            </div>

            <input type="submit" value="Save Changes" />
        </form>
    </div>
</div>

</body>
<style>
    body {
        font-family: Arial, sans-serif;
        color: rgb(98, 68, 91);
        background: radial-gradient(circle, rgba(247,238,238,1) 8%, rgba(240,172,237,1) 100%);
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow-x: hidden;
    }

    a {
        text-decoration: none;
    }

    #header {
        display: flex;
        height: 100px;
        background: radial-gradient(circle, rgba(236,205,205,1) 8%, rgba(186,112,182,1) 100%);
        border-bottom-left-radius: 0px;
        border-bottom-right-radius: 0px;
        position: relative;
        width: 100%;
    }

    .headerDiv {
        width: 90px;
        height: 40px;
        border-radius: 10px;
        border: 0px rgba(0, 0, 0, 0.25) solid;
        padding: 7.5px;
        font-size: 24px;
        color: #401F3E;
        position: relative;
        transform: translateY(-50%);
        top: 43%;
        text-align: center;
        margin: 5px;
        display: block;
    }
    #homeButtonDiv {
        left: 13px;
        width: 45px;
        border-radius: 50%;
    }
    #homeButton {
        width: 45px;
        height: 45px;
        position: relative;
        top: -2px;
    }

    verticallyCentered {
        position: relative;
        transform: translateY(-50%);
        display: block;
        top: 50%;
    }

    #famBaseImage {
        transform: translateX(-50%);
        position: absolute;
        top: -30px;
        left: 50%;
        width: 225px;
        border-radius: 20px;
    }

    #accountConnection {
        display: flex;
        transform: translateX(-100%);
        left: 99.5%;
        position: absolute;
        height: 100px;
    }

    #formBody {
        width: 340px;
        background-color: aliceblue;
        border-radius: 20px;
        margin: 40px auto 0 auto;
        padding-bottom: 30px;
        box-shadow: 0 4px 12px rgba(64, 31, 62, 0.15);
        position: relative;
    }

    h1 {
        text-align: center;
        padding-top: 25px;
        margin-bottom: 15px;
        font-size: 24px;
        color: #401F3E;
    }

    #inputs {
        display: flex;
        justify-content: center;
        width: 100%;
    }

    #inputs form {
        width: 80%;
    }

    input {
        margin-bottom: 12px;
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        border-radius: 4px;
        border: 1px solid #ccc;
    }

    input[type="submit"] {
        width: auto;
        padding: 8px 20px;
        display: block;
        margin: 15px auto 0 auto;
        cursor: pointer;
        font-weight: bold;
        background-color: #732f65;
        color: white;
        border: none;
        border-radius: 8px;
    }

    input[type="submit"]:hover {
        opacity: 0.9;
    }
</style>
</html>
