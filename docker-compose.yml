version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: yate-mysql
    restart: always
    environment:
      MYSQL_DATABASE: yate
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: yate-app
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=yate
      - DB_USER=root
      - DB_PASSWORD=root
    depends_on:
      - mysql

volumes:
  mysql_data: