<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping List</title>
    <link href="https://i.ibb.co/vxwxYx1/fam-Base-Icon.png" rel="icon" type="image/x-icon">
    <style>
        :root {
            --primary-dark: #401F3E;
            --primary-color: #732f65;
            --card-bg: rgb(255, 232, 230);
            --accent-bg: rgba(115, 47, 101, 0.68);
            --text-main: #401F3E;
            --text-muted: #5A4B51;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow-subtle: 0 4px 12px rgba(64, 31, 62, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
            color: var(--primary-color);
            background: radial-gradient(circle, rgba(236, 205, 205, 1) 25%, rgba(186, 112, 182, 1) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        header {
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            background: radial-gradient(circle, rgba(236, 205, 205, 0.9) 8%, rgba(186, 112, 182, 0.9) 100%);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .home-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--card-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-subtle);
            transition: transform 0.2s;
        }

        .home-btn:hover {
            transform: scale(1.05);
        }

        .home-btn img {
            width: 24px;
            height: 24px;
        }

        .brand-logo img {
            height: 40px;
            border-radius: 8px;
        }

        .nav-link {
            padding: 8px 16px;
            border-radius: var(--radius-md);
            background-color: var(--card-bg);
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--primary-dark);
            box-shadow: var(--shadow-subtle);
            transition: background 0.2s;
        }

        .nav-link:hover {
            background-color: #ffd4d1;
        }

        .dashboard-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding: 24px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
            justify-content: center;
            align-items: center;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-subtle);
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-dark);
            text-align: center;
            padding-bottom: 8px;
            border-bottom: 2px solid rgba(98, 68, 91, 0.2);
        }

        .scrollable-list {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .scrollable-list::-webkit-scrollbar {
            width: 6px;
        }

        .scrollable-list::-webkit-scrollbar-thumb {
            background-color: rgba(98, 68, 91, 0.2);
            border-radius: 10px;
        }

        #square-before-task {
            width: 35px;
            height: 35px;
            margin: 0 12px 0 0;
            border-radius: 10px;
            background-color: rgba(170, 52, 165, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        li {
            background: rgba(255, 255, 255, 0.5);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .task-details {
            flex-grow: 1;
        }

        li .bold {
            font-weight: 700;
            color: var(--primary-dark);
        }

        .item-actions {
            display: flex;
            gap: 8px;
            margin-left: auto;
            padding-left: 10px;
        }

        .btn-action {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            text-align: center;
            display: inline-block;
            box-shadow: var(--shadow-subtle);
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        .group-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <a href="/" th:if="${#authorization.expression('isAuthenticated()')}">
            <div class="home-btn">
                <img alt="Home" src="https://i.ibb.co/5TR58kn/home.png">
            </div>
        </a>
        <div class="brand-logo">
            <img alt="FamBase Logo" src="https://i.ibb.co/Vvp7kp1/famge-removebg-preview.png">
        </div>
    </div>

    <div class="header-right">
        <a class="nav-link" href="/login" th:if="${#authorization.expression('!isAuthenticated()')}">Login</a>
        <a class="nav-link" href="/register" th:if="${#authorization.expression('!isAuthenticated()')}">Register</a>
        <a class="nav-link" href="/logout" th:if="${#authorization.expression('isAuthenticated()')}">Logout</a>
    </div>
</header>

<div class="dashboard-container">
    <section class="card" id="shopping-list">
        <div class="card-title">Your Shopping List</div>
        <div class="scrollable-list">
            <div th:if="${#lists.isEmpty(shoppingItems)}" style="text-align: center; color: var(--text-muted); padding: 15px; font-style: italic;">
                Your shopping list is empty.
            </div>
            <ul>
                <li th:each="shoppingItem : ${shoppingItems}">
                    <div id="square-before-task">
                        <span class="bold" th:if="${shoppingItem.status}">✅</span>
                        <span class="bold" th:if="${!shoppingItem.status}">❌</span>
                    </div>
                    <div class="task-details">
                        <span class="bold" th:text="${shoppingItem.name}"></span>,
                        Quantity: <span class="bold" th:text="${shoppingItem.quantity}"></span>,
                        Store: <span class="bold" th:text="${shoppingItem.store}"></span>,
                        Importance: <span class="bold" th:text="${shoppingItem.importance}"></span>
                    </div>
                    <div class="item-actions">
                        <a th:href="@{/shoppingItems/edit/{id}(id=${shoppingItem.id})}">✎</a>
                        <a th:href="@{|/shoppingItems/delete?id=${shoppingItem.id}|}">🗑️</a>
                    </div>
                </li>
            </ul>
        </div>
    </section>

    <div class="group-container" th:if="${#authorization.expression('isAuthenticated()')}">
        <a class="btn-action" href="grouped">Group list items by category</a>
    </div>
</div>

</body>
</html>
